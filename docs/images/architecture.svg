<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6575"/>
    </marker>
  </defs>
  <rect width="1100" height="430" rx="14" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">Data Lake: S3 (raw JSON) → Spark on EMR → S3 (Parquet)</text>

  <!-- landing zone -->
  <rect x="30" y="110" width="220" height="210" rx="12" fill="#fff4e5" stroke="#e8890c" stroke-width="2"/>
  <text x="140" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#9a5a00">S3 · Landing zone</text>
  <rect x="50" y="165" width="180" height="40" rx="6" fill="#ffffff" stroke="#f0b866"/>
  <text x="140" y="190" text-anchor="middle" font-size="13" fill="#5b4a2e">song_data/  (JSON)</text>
  <rect x="50" y="220" width="180" height="40" rx="6" fill="#ffffff" stroke="#f0b866"/>
  <text x="140" y="245" text-anchor="middle" font-size="13" fill="#5b4a2e">log-data/  (JSON)</text>
  <text x="140" y="295" text-anchor="middle" font-size="12" fill="#7a6545">semi-structured, raw</text>

  <!-- EMR -->
  <rect x="330" y="80" width="400" height="270" rx="14" fill="#fff1e8" stroke="#e25a1c" stroke-width="2"/>
  <text x="530" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#a83e0c">Amazon EMR · Apache Spark</text>
  <g font-size="13" fill="#5a2a10">
    <rect x="355" y="128" width="350" height="44" rx="8" fill="#ffffff" stroke="#f1a27b"/>
    <text x="370" y="155">1. Read JSON → DataFrames (schema inference)</text>
    <rect x="355" y="180" width="350" height="44" rx="8" fill="#ffffff" stroke="#f1a27b"/>
    <text x="370" y="207">2. Filter NextSong, dedupe, epoch ms → timestamp</text>
    <rect x="355" y="232" width="350" height="44" rx="8" fill="#ffffff" stroke="#f1a27b"/>
    <text x="370" y="259">3. Derive time parts, join logs ⨝ songs</text>
    <rect x="355" y="284" width="350" height="44" rx="8" fill="#ffffff" stroke="#f1a27b"/>
    <text x="370" y="311">4. Write partitioned Parquet (overwrite)</text>
  </g>

  <!-- processed zone -->
  <rect x="810" y="80" width="260" height="270" rx="12" fill="#e8f0fb" stroke="#4a6fb5" stroke-width="2"/>
  <text x="940" y="110" text-anchor="middle" font-size="17" font-weight="700" fill="#27467f">S3 · Processed zone</text>
  <g font-size="12.5" fill="#1f3a66">
    <rect x="828" y="125" width="224" height="36" rx="6" fill="#fde8e0" stroke="#f98866"/>
    <text x="840" y="148">songplays/  year=/month=</text>
    <rect x="828" y="167" width="224" height="36" rx="6" fill="#ffffff" stroke="#9db4dc"/>
    <text x="840" y="190">songs/  year=/artist_id=</text>
    <rect x="828" y="209" width="224" height="36" rx="6" fill="#ffffff" stroke="#9db4dc"/>
    <text x="840" y="232">time_table/  year=/month=</text>
    <rect x="828" y="251" width="224" height="36" rx="6" fill="#ffffff" stroke="#9db4dc"/>
    <text x="840" y="274">users/</text>
    <rect x="828" y="293" width="224" height="36" rx="6" fill="#ffffff" stroke="#9db4dc"/>
    <text x="840" y="316">artists/</text>
  </g>

  <g stroke="#5b6575" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M250 215 L328 215"/>
    <path d="M730 215 L808 215"/>
  </g>
  <text x="289" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">read</text>
  <text x="769" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">write</text>

  <text x="550" y="400" text-anchor="middle" font-size="13" fill="#6b7280">Schema-on-read in, columnar + partitioned out: the processed zone can be queried with Athena, Redshift Spectrum or Spark</text>
</svg>
